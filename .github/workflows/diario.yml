# Analiza y publica la web: 07:00 y 13:00 de Ecuador (12:00 y 18:00 UTC).
name: Picks diarios
on:
  schedule:
    - cron: "0 12 * * *"
    - cron: "0 18 * * *"
  workflow_dispatch: {}
permissions:
  contents: write
  pages: write
  id-token: write
concurrency:
  group: picks
  cancel-in-progress: false
jobs:
  analizar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12", cache: pip}
      - run: pip install -r requirements.txt
      - name: Analizar partidos
        env:
          API_FOOTBALL_KEY: ${{ secrets.API_FOOTBALL_KEY }}
          ODDS_API_KEY: ${{ secrets.ODDS_API_KEY }}
          APIFY_TOKEN: ${{ secrets.APIFY_TOKEN }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          BANCA: ${{ vars.BANCA }}
        run: python main.py hoy
      - name: Guardar datos
        run: |
          git config user.name "picks-bot"
          git config user.email "picks-bot@users.noreply.github.com"
          for p in reportes web/data datos/sistema.db; do [ -e "$p" ] && git add -A "$p"; done; true
          git commit -m "Picks $(date -u +%F_%H)" || echo "Sin cambios"
          git pull --rebase --autostash && git push
      - uses: actions/upload-pages-artifact@v3
        with: {path: web}
  publicar:
    needs: analizar
    runs-on: ubuntu-latest
    environment: {name: github-pages}
    steps:
      - uses: actions/deploy-pages@v4
