# Backtest de la estrategia cada domingo (09:00 Ecuador) o a pedido desde la web.
name: Backtest semanal
on:
  schedule:
    - cron: "0 14 * * 0"
  workflow_dispatch: {}
permissions:
  contents: write
  pages: write
  id-token: write
concurrency:
  group: picks
  cancel-in-progress: false
jobs:
  backtest:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12", cache: pip}
      - run: pip install -r requirements.txt
      - run: python main.py backtest
      - name: Prueba de los últimos 30 días con datos reales
        run: python tests/ultimos30.py
      - name: Guardar
        run: |
          git config user.name "picks-bot"
          git config user.email "picks-bot@users.noreply.github.com"
          for p in web/data; do [ -e "$p" ] && git add -A "$p"; done; true
          git commit -m "Backtest $(date -u +%F)" || echo "Sin cambios"
          git pull --rebase --autostash && git push
      - uses: actions/upload-pages-artifact@v3
        with: {path: web}
  publicar:
    needs: backtest
    runs-on: ubuntu-latest
    environment: {name: github-pages}
    steps:
      - uses: actions/deploy-pages@v4
