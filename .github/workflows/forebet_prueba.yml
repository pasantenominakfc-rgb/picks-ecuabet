name: Prueba de Forebet (diagnóstico)

# Diagnóstico manual del actor de Apify: lanza 1 corrida asíncrona (máx. 10 partidos, solo hoy), espera hasta 8 min
# y muestra estado, campos y cuotas. No imprime el token.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  prueba:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Lanzar, esperar y mostrar la estructura
        env:
          APIFY_TOKEN: ${{ secrets.APIFY_TOKEN }}
        run: |
          python3 - <<'PY'
          import json, os, sys, time, urllib.request, urllib.error
          from datetime import datetime, timedelta, timezone
          tok = os.environ.get("APIFY_TOKEN", "")
          if not tok:
              print("FALTA el secret APIFY_TOKEN"); sys.exit(1)
          H = {"Authorization": "Bearer " + tok, "Content-Type": "application/json"}
          def api(metodo, ruta, cuerpo=None):
              rq = urllib.request.Request("https://api.apify.com/v2" + ruta, method=metodo, headers=H,
                                          data=json.dumps(cuerpo).encode() if cuerpo is not None else None)
              try:
                  with urllib.request.urlopen(rq, timeout=60) as r:
                      return json.load(r)
              except urllib.error.HTTPError as e:
                  print("HTTP", e.code, ruta.split("?")[0], e.read().decode("utf-8", "replace")[:300].replace(tok, "***")); sys.exit(1)
          hoy = (datetime.now(timezone.utc) - timedelta(hours=5)).date()
          entrada = {"matchScope": "byDate", "dateRange": "today and tomorrow",
                     "predictionMarkets": ["match1x2", "underOver25", "bothTeamsToScore"],
                     "countries": [], "leagues": [], "maxResults": 10}
          run = api("POST", "/acts/solidcode~forebet-scraper/runs", entrada)["data"]
          print("run lanzado, estado:", run.get("status"))
          t0 = time.time()
          while run.get("status") not in ("SUCCEEDED", "FAILED", "ABORTED", "TIMED-OUT") and time.time() - t0 < 480:
              time.sleep(10)
              run = api("GET", "/actor-runs/" + run["id"])["data"]
          print("estado final:", run.get("status"), "| segundos:", int(time.time() - t0), "| mensaje:", run.get("statusMessage"))
          print("costo USD:", run.get("usageTotalUsd"), "| cobrado:", json.dumps(run.get("chargedEventCounts")))
          if run.get("status") not in ("SUCCEEDED",):
              api("POST", "/actor-runs/" + run["id"] + "/abort")
          items = api("GET", "/datasets/" + run["defaultDatasetId"] + "/items?format=json&clean=true")
          print("partidos devueltos:", len(items))
          if items:
              campos = sorted({k for f in items for k in f})
              print("campos:", ", ".join(campos))
              print("campos de cuotas:", [k for k in campos if "odd" in k.lower()] or "NINGUNO")
              print("tipos del primero:", json.dumps({k: type(v).__name__ for k, v in items[0].items()}, ensure_ascii=False))
          PY
