# --- Perfil PRO (documentado; plan de pago de API-Football) ------------------------
# Valores a poner arriba para analizarlo todo (hoy +5 días, todas las ligas):
perfil_pro:
  perfil: pro
  af_plan: pro
  af_max_por_minuto: 300
  dias_adelante: 5
  incluir_todas_las_ligas: true
  max_predicciones_af: 40
  ligas: "ligas + ligas_extra"

# --- Locas: simples de ALTO RIESGO y alto pago (se gana pocas veces; stake mínimo) --------------------
# Solo con cuota REAL de casas (cuota_ecuabet o mejor cuota de The Odds API/API-Football). Sin ella no hay Locas:
# las cuotas estimadas o las de referencia de Forebet nunca se usan para su EV. Exigen el mismo consenso que Valor.
locas_cuota_min: 3.0
locas_cuota_max: 12
locas_prob_min: 0.12
locas_ev_min: 0.10
locas_stake_pct: 0.005        # 0.5% de la banca por Loca (nunca menos que stake_minimo)
locas_max_dia: 3
locas_exposicion_dia_pct: 0.015   # tope diario de Locas: 1.5% de la banca

# Forebet (Apify) es asíncrono: se sondea el run cada ~10 s hasta este máximo; si se agota, se aborta y se sigue sin Forebet
forebet_espera_max_seg: 480   # 8 minutos
