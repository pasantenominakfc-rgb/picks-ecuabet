<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; connect-src 'self' https://api.github.com; img-src 'self' data:; style-src 'self' 'unsafe-inline'; script-src 'self'; base-uri 'none'; form-action 'none'">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="color-scheme" content="light dark">
<meta name="theme-color" content="#F3F5F8" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0A101C" media="(prefers-color-scheme: dark)">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Picks">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="stylesheet" href="styles.css">
<title>Picks · Valor diario</title>
</head>
<body>
<!-- Iconos (sprite local, sin recursos externos) -->
<svg width="0" height="0" style="position:absolute" aria-hidden="true" focusable="false">
 <symbol id="i-star" viewBox="0 0 24 24"><path d="M12 3l2.7 5.6 6.1.9-4.4 4.3 1 6.1L12 17l-5.4 2.9 1-6.1L3.2 9.5l6.1-.9z"/></symbol>
 <symbol id="i-ball" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M12 7.5l3.8 2.8-1.4 4.4H9.6L8.2 10.3z"/></symbol>
 <symbol id="i-chart" viewBox="0 0 24 24"><path d="M3 20h18M6 16l4-5 3 3 5-7"/></symbol>
 <symbol id="i-list" viewBox="0 0 24 24"><path d="M4 6h16M4 12h10M4 18h6"/></symbol>
 <symbol id="i-gear" viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="M12 2v3M12 19v3M2 12h3M19 12h3M4.9 4.9l2.1 2.1M17 17l2.1 2.1M19.1 4.9L17 7M7 17l-2.1 2.1"/></symbol>
 <symbol id="i-refresh" viewBox="0 0 24 24"><path d="M20 11a8 8 0 10-2.3 5.7M20 4v7h-7"/></symbol>
 <symbol id="i-clock" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></symbol>
 <symbol id="i-shield" viewBox="0 0 24 24"><path d="M12 3l8 3v6c0 5-3.5 8-8 9-4.5-1-8-4-8-9V6z"/><path d="M8.5 12l2.5 2.5 4.5-5"/></symbol>
 <symbol id="i-diamond" viewBox="0 0 24 24"><path d="M12 3l8 9-8 9-8-9z"/></symbol>
 <symbol id="i-rocket" viewBox="0 0 24 24"><path d="M4 20L12 4l8 16-8-4z"/></symbol>
 <symbol id="i-alert" viewBox="0 0 24 24"><path d="M12 3l10 18H2z"/><path d="M12 10v5M12 18h.01"/></symbol>
 <symbol id="i-info" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M12 11v6M12 7.5h.01"/></symbol>
 <symbol id="i-plus" viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></symbol>
 <symbol id="i-check" viewBox="0 0 24 24"><path d="M5 12.5l4.5 4.5L19 7"/></symbol>
 <symbol id="i-chev" viewBox="0 0 24 24"><path d="M6 9l6 6 6-6"/></symbol>
 <symbol id="i-wifi" viewBox="0 0 24 24"><path d="M2 9a15 15 0 0120 0M5 12.5a10 10 0 0114 0M8.5 16a5 5 0 017 0M12 19.5h.01"/></symbol>
 <symbol id="i-search" viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="M20 20l-3.5-3.5"/></symbol>
<symbol id="i-bolt" viewBox="0 0 24 24"><path d="M13 3L5 13h6l-1 8 8-10h-6z"/></symbol>
 <symbol id="i-copy" viewBox="0 0 24 24"><rect x="9" y="9" width="11" height="11" rx="2"/><path d="M5 15V6a2 2 0 012-2h9"/></symbol>
</svg>

<div class="app" id="appmain">
  <header class="top">
    <div><h1 id="titulo">Hoy</h1><div class="sub" id="sub">Cargando…</div></div>
    <button class="iconbtn" id="recargar" aria-label="Recargar datos"><svg class="i" aria-hidden="true"><use href="#i-refresh"/></svg></button>
  </header>
  <div id="avisos" aria-live="polite"></div>
  <section class="vista" id="v-hoy" aria-busy="true"><div class="sk" aria-label="Cargando picks"><i style="height:12px;width:45%"></i><i style="height:20px;width:75%"></i><i style="height:14px;width:60%"></i><i style="height:52px;width:100%"></i><i style="height:44px;width:100%;margin:0"></i></div></section>
  <section class="vista hide" id="v-partidos"></section>
  <section class="vista hide" id="v-rend"></section>
  <section class="vista hide" id="v-fuentes"></section>
  <section class="vista hide" id="v-ajustes"></section>
</div>

<div class="ticketbar" id="ticketbar"><span id="tbtxt"></span><button class="btn small" id="vertk">Ver ticket</button></div>
<div class="sheet" id="sheet"><div class="panel" id="sheetp" role="dialog" aria-modal="true" aria-labelledby="sheet-t"></div></div>
<div class="toast" id="toast" role="status"></div>

<nav aria-label="Secciones"><div class="in">
  <button data-v="hoy" aria-current="page" aria-label="Hoy"><svg class="i" aria-hidden="true"><use href="#i-star"/></svg>Hoy</button>
  <button data-v="partidos" aria-label="Partidos"><svg class="i" aria-hidden="true"><use href="#i-ball"/></svg>Partidos</button>
  <button data-v="rend" aria-label="Rendimiento"><svg class="i" aria-hidden="true"><use href="#i-chart"/></svg>Rendim.</button>
  <button data-v="fuentes" aria-label="Fuentes"><svg class="i" aria-hidden="true"><use href="#i-list"/></svg>Fuentes</button>
  <button data-v="ajustes" aria-label="Ajustes"><svg class="i" aria-hidden="true"><use href="#i-gear"/></svg>Ajustes</button>
</div></nav>

<script src="app.js" defer></script>
</body>
</html>
